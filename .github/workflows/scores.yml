name: Scores, news and lines

on:
  schedule:
    - cron: "4,34 * * * *"   # every 30 minutes; only saves when something changed
  workflow_dispatch: {}

permissions:
  contents: write

# shares a queue with the data update so the two never save at the same moment
concurrency:
  group: bff-site-data
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # the branch as it is now, not the commit that queued this run (the other job may have saved since)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install libraries (reading nflverse's stats files)
        run: pip install pandas pyarrow
      - name: Final scores and box scores (nflverse, after each game) and headline links
        env:
          BFF_NEWS_LINKS: ${{ vars.BFF_NEWS_LINKS }}
        run: |
          python live_update.py
          python news_update.py
      - name: Pull prop lines for players ruled out in the news
        run: python ff_lines.py --refresh
      - name: BFF Originals (breaking news, game previews and recaps, written by BFF's own writer)
        id: articles
        continue-on-error: true
        run: python articles.py
      - name: Check the files before saving
        run: python check_page.py --json
      - name: Save
        run: |
          git config user.name "gridiron-fantasy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in live.json news.json lines.json articles.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Scores update $(date -u +%H:%M)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            echo "Save attempt $i did not go through; retrying"; sleep $((i*10))
          done
          echo "Could not save this time; the next run will catch up"; exit 0
