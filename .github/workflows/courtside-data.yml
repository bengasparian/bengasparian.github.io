name: Courtside data (basketball tool)

# Data for the Courtside basketball commentary tool (/courtside/). Writes ONLY to the separate `courtside-data` branch,
# never to main, so it cannot interfere with the fantasy football site or its jobs.
on:
  push:
    branches: [main]
    paths: ["courtside/scripts/**", ".github/workflows/courtside-data.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: courtside-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: courtside/scripts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe sources
        run: python courtside/scripts/probe.py out/probe
      - name: Publish to courtside-data branch
        run: |
          cd out
          git init -q -b courtside-data
          git config user.name "courtside-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Courtside data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" courtside-data
